name: Development Release

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  dev-release:
    name: Create Development Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'

    - name: Get short SHA
      id: sha
      run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build binaries
      env:
        VERSION: dev-${{ steps.sha.outputs.short }}
        COMMIT: ${{ github.sha }}
        BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        GOPRIVATE: github.com/ambientlabscomputing/*
        GONOSUMCHECK: github.com/ambientlabscomputing/*
      run: |
        mkdir -p bin
        
        LDFLAGS="-X github.com/ambientlabscomputing/mycelium_mesh_agent/pkg/version.Version=${VERSION} \
          -X github.com/ambientlabscomputing/mycelium_mesh_agent/pkg/version.Commit=${COMMIT} \
          -X github.com/ambientlabscomputing/mycelium_mesh_agent/pkg/version.BuildDate=${BUILD_DATE}"
        
        # mycelium-mesh-agent - Linux AMD64
        GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/mycelium-mesh-agent-linux-amd64 ./cmd/serve
        
        # mycelium-mesh-agent - Linux ARM64
        GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o bin/mycelium-mesh-agent-linux-arm64 ./cmd/serve
        
        # mycelium-mesh-agent - macOS AMD64
        GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/mycelium-mesh-agent-darwin-amd64 ./cmd/serve
        
        # mycelium-mesh-agent - macOS ARM64 (M1/M2/M3)
        GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o bin/mycelium-mesh-agent-darwin-arm64 ./cmd/serve
        
        # mycelium-mesh-agent - Windows AMD64
        GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/mycelium-mesh-agent-windows-amd64.exe ./cmd/serve

    - name: Generate checksums
      run: |
        cd bin
        sha256sum * > checksums.txt
        cat checksums.txt

    - name: Delete existing dev release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete dev --yes || true
        git push origin :refs/tags/dev || true
        sleep 5

    - name: Create Development Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: dev
        name: Development Build (Latest)
        prerelease: true
        files: bin/*
        body: |
          # Mycelium Mesh Agent - Development Build
          
          **⚠️ This is an automated development build from the `develop` branch**
          
          - Version: `dev-${{ steps.sha.outputs.short }}`
          - Commit: ${{ github.sha }}
          - Built: ${{ github.event.head_commit.timestamp }}
          
          ## About This Build
          
          This is a rolling development release that's automatically updated on every push to `develop`.
          It includes the latest features and fixes but may be unstable. For production use, please use
          tagged releases.
          
          ## Installation
          
          Download the appropriate binary for your platform and make it executable:
          
          ```bash
          # Example for macOS ARM64
          curl -L -o mycelium-mesh-agent https://github.com/ambientlabscomputing/mycelium_mesh_agent/releases/download/dev/mycelium-mesh-agent-darwin-arm64
          chmod +x mycelium-mesh-agent
          sudo mv mycelium-mesh-agent /usr/local/bin/
          ```
          
          ## Verification
          
          Verify the binary integrity:
          ```bash
          sha256sum -c checksums.txt
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
