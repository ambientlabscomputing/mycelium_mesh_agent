name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.5'

    - name: Build binaries
      env:
        VERSION: ${{ github.ref_name }}
        COMMIT: ${{ github.sha }}
        BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        GOPRIVATE: github.com/ambientlabscomputing/*
        GONOSUMCHECK: github.com/ambientlabscomputing/*
      run: |
        mkdir -p bin
        
        LDFLAGS="-X github.com/ambientlabscomputing/mycelium_mesh_agent/pkg/version.Version=${VERSION} \
          -X github.com/ambientlabscomputing/mycelium_mesh_agent/pkg/version.Commit=${COMMIT} \
          -X github.com/ambientlabscomputing/mycelium_mesh_agent/pkg/version.BuildDate=${BUILD_DATE}"
        
        # mycelium-mesh-agent - Linux AMD64
        GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/mycelium-mesh-agent-linux-amd64 ./cmd/serve
        
        # mycelium-mesh-agent - Linux ARM64
        GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o bin/mycelium-mesh-agent-linux-arm64 ./cmd/serve
        
        # mycelium-mesh-agent - macOS AMD64
        GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/mycelium-mesh-agent-darwin-amd64 ./cmd/serve
        
        # mycelium-mesh-agent - macOS ARM64 (M1/M2/M3)
        GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o bin/mycelium-mesh-agent-darwin-arm64 ./cmd/serve
        
        # mycelium-mesh-agent - Windows AMD64
        GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/mycelium-mesh-agent-windows-amd64.exe ./cmd/serve

    - name: Generate checksums
      run: |
        cd bin
        sha256sum * > checksums.txt
        cat checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          bin/mycelium-mesh-agent-*
          bin/checksums.txt
        body: |
          # Mycelium Mesh Agent ${{ github.ref_name }}
          
          See [CHANGELOG.md](https://github.com/ambientlabscomputing/mycelium_mesh_agent/blob/main/CHANGELOG.md) for details.
          
          ## What's Included
          
          - **mycelium-mesh-agent** - Edge-optimized service mesh runtime for Underleaf platform
          
          ## About Mycelium Mesh Agent
          
          Mycelium Mesh Agent (MMA) is the runtime data-plane component of the Underleaf distributed edge computing platform. It provides:
          - 🔐 Identity-aware capability bindings with policy enforcement
          - 🌐 Service discovery and mesh networking
          - 📊 Telemetry collection and buffering
          - 🛡️ Trust-tier based security (official > certified > community)
          - 🔌 Offline-first operation with last-known-good state
          
          MMA is designed to be **managed by Underleaf Agent (UA)** via the capability registry system. For production deployments, UA will automatically install, configure, and supervise MMA.
          
          ## Manual Installation
          
          Download the appropriate binary for your platform:
          - **Linux AMD64**: `mycelium-mesh-agent-linux-amd64`
          - **Linux ARM64**: `mycelium-mesh-agent-linux-arm64`
          - **macOS AMD64**: `mycelium-mesh-agent-darwin-amd64`
          - **macOS ARM64** (M1/M2/M3): `mycelium-mesh-agent-darwin-arm64`
          - **Windows AMD64**: `mycelium-mesh-agent-windows-amd64.exe`
          
          ### Unix/macOS
          ```bash
          # Download and make executable
          curl -L -o mycelium-mesh-agent https://github.com/ambientlabscomputing/mycelium_mesh_agent/releases/download/${{ github.ref_name }}/mycelium-mesh-agent-darwin-arm64
          chmod +x mycelium-mesh-agent
          sudo mv mycelium-mesh-agent /usr/local/bin/
          
          # Start the agent
          mycelium-mesh-agent
          ```
          
          ### Windows
          ```powershell
          # Download mycelium-mesh-agent-windows-amd64.exe and add to PATH
          ```
          
          ## Verification
          
          Verify the integrity of downloaded binaries using the checksums:
          ```bash
          sha256sum -c checksums.txt
          ```
          
          ## API Endpoints
          
          MMA exposes a REST API on port 8080:
          - `GET /health` - Health check
          - `GET /api/v1/version` - Version information
          - `POST /api/v1/bindings/request` - Request capability binding
          - `GET /api/v1/introspect/mesh` - Mesh health summary
          - `POST /api/v1/telemetry/flush` - Flush telemetry
          
          ## Requirements
          
          - **Underleaf Agent**: MMA consumes events from UA via gRPC (Unix socket `/tmp/ua_mma.sock`)
          - **Capability Registry**: MMA validates capabilities against UCRS-synced cache
          
          For full documentation, see the [agent_docs/](https://github.com/ambientlabscomputing/mycelium_mesh_agent/tree/main/agent_docs) directory.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
